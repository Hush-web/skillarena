<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proofed</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117; color: #e6edf3;
      margin: 0; padding: 2rem;
      display: flex; justify-content: center;
      min-height: 100vh;
    }
    .wrap { width: 100%; max-width: 760px; }
    h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
    .sub { color: #8b949e; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .card {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem;
    }
    .prompt { font-size: 0.95rem; margin-bottom: 1rem; line-height: 1.5; }
    .prompt strong { color: #58a6ff; }
    textarea {
      width: 100%; min-height: 240px;
      background: #0d1117; color: #e6edf3;
      border: 1px solid #30363d; border-radius: 6px;
      padding: 0.75rem;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.9rem; line-height: 1.5;
      resize: vertical; tab-size: 4;
    }
    textarea:focus { outline: none; border-color: #58a6ff; }
    input[type="text"] {
      background: #0d1117; color: #e6edf3;
      border: 1px solid #30363d; border-radius: 6px;
      padding: 0.5rem 0.75rem; font-size: 0.9rem;
    }
    input[type="text"]:focus { outline: none; border-color: #58a6ff; }
    select {
      background: #0d1117; color: #e6edf3;
      border: 1px solid #30363d; border-radius: 6px;
      padding: 0.5rem 0.75rem; font-size: 0.9rem;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: #58a6ff; }
    .toolbar {
      display: flex; gap: 0.5rem; align-items: center;
      margin-bottom: 0.75rem; flex-wrap: wrap;
    }
    .row { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
    button {
      background: #238636; color: white; border: none;
      padding: 0.6rem 1.2rem; border-radius: 6px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #2ea043; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.ghost { background: transparent; border: 1px solid #30363d; color: #e6edf3; }
    button.ghost:hover { background: #21262d; }
    .result {
      margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 6px;
      font-size: 0.9rem; display: none;
      font-family: ui-monospace, monospace;
      white-space: pre-wrap; word-break: break-word;
    }
    .result.pass { background: #0f2a1a; border: 1px solid #238636; color: #7ee787; }
    .result.fail { background: #2a0f14; border: 1px solid #f85149; color: #ff7b72; }
    .result.show { display: block; }
    .nav { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .nav button {
      background: #21262d; border: 1px solid #30363d;
      padding: 0.35rem 0.75rem; font-size: 0.8rem;
      font-weight: 500; color: #8b949e;
    }
    .nav button.active { background: #1f6feb; color: white; border-color: #1f6feb; }
    .board-title {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;
      color: #8b949e; margin-bottom: 0.75rem;
    }
    .board-row {
      display: grid; grid-template-columns: 2rem 1fr auto auto;
      gap: 0.75rem; padding: 0.5rem 0;
      border-bottom: 1px solid #21262d; font-size: 0.9rem;
      align-items: center;
    }
    .board-row:last-child { border-bottom: none; }
    .board-row .rank {
      color: #8b949e; font-weight: 600; text-align: right;
    }
    .board-row .name { font-weight: 500; }
    .board-row .solved { color: #8b949e; font-size: 0.8rem; }
    .board-row .pts { color: #7ee787; font-weight: 600; }
    .board-empty { color: #8b949e; font-size: 0.85rem; padding: 0.5rem 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Proofed</h1>
    <div class="sub">Your skill, on record.</div>

    <div class="nav" id="nav"></div>

    <div class="card">
      <div class="prompt" id="prompt">Loading challenge...</div>

      <div class="toolbar">
        <input type="text" id="player" placeholder="Your name" maxlength="20" />
        <select id="language">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="cpp">C++</option>
        </select>
      </div>

      <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"></textarea>

      <div class="row">
        <button id="submit">Submit</button>
        <button class="ghost" id="reset">Reset</button>
      </div>

      <div class="result" id="result"></div>
    </div>

    <div class="card">
      <div class="board-title">Leaderboard</div>
      <div id="board"></div>
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";
    let currentId = 1;
    let currentStarters = {};

    const $nav = document.getElementById("nav");
    const $prompt = document.getElementById("prompt");
    const $code = document.getElementById("code");
    const $language = document.getElementById("language");
    const $player = document.getElementById("player");
    const $result = document.getElementById("result");
    const $submit = document.getElementById("submit");
    const $reset = document.getElementById("reset");
    const $board = document.getElementById("board");

    // Restore player name from last session
    $player.value = localStorage.getItem("proofed_player") || "";

    function starterFor(lang) {
      return currentStarters[lang] || currentStarters.python || "";
    }

    async function loadNav() {
      const r = await fetch(`${API}/challenges`);
      const list = await r.json();
      $nav.innerHTML = "";
      list.forEach(c => {
        const b = document.createElement("button");
        b.textContent = `${c.id}. ${c.title} (${c.points} pts)`;
        b.dataset.id = c.id;
        b.onclick = () => load(c.id);
        $nav.appendChild(b);
      });
    }

    async function load(id) {
      currentId = id;
      $result.className = "result";
      $prompt.textContent = "Loading...";

      const r = await fetch(`${API}/challenge/${id}`);
      const ch = await r.json();
      if (ch.error) {
        $prompt.textContent = "No challenge found.";
        return;
      }

      currentStarters = ch.starters || {};
      $prompt.innerHTML = `<strong>${ch.title}</strong> <span style="color:#8b949e;font-size:0.8rem;">(${ch.points} pts)</span><br>${ch.prompt}`;
      $code.value = starterFor($language.value);

      document.querySelectorAll(".nav button").forEach(b => {
        b.classList.toggle("active", Number(b.dataset.id) === id);
      });
    }

    async function loadLeaderboard() {
      const r = await fetch(`${API}/leaderboard`);
      const rows = await r.json();

      if (!rows.length) {
        $board.innerHTML = '<div class="board-empty">No submissions yet. Be the first.</div>';
        return;
      }

      $board.innerHTML = "";
      rows.forEach((row, i) => {
        const div = document.createElement("div");
        div.className = "board-row";
        div.innerHTML = `
          <span class="rank">${i + 1}.</span>
          <span class="name"></span>
          <span class="solved">${row.solved} solved</span>
          <span class="pts">${row.score} pts</span>
        `;
        div.querySelector(".name").textContent = row.player;
        $board.appendChild(div);
      });
    }

    $language.onchange = () => {
      $code.value = starterFor($language.value);
      $result.className = "result";
    };

    $player.onchange = () => {
      localStorage.setItem("proofed_player", $player.value.trim());
    };

    $submit.onclick = async () => {
      $submit.disabled = true;
      $submit.textContent = "Judging...";
      $result.className = "result";

      const playerName = ($player.value.trim() || "anonymous");
      localStorage.setItem("proofed_player", playerName);

      try {
        const r = await fetch(`${API}/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            challenge_id: currentId,
            language: $language.value,
            code: $code.value,
            player: playerName,
          }),
        });
        const data = await r.json();

        if (data.error) {
          $result.className = "result fail show";
          const detail = data.detail ? `\n\n${data.detail}` : "";
          $result.textContent = `Error: ${data.error}${detail}`;
        } else if (data.correct) {
          $result.className = "result pass show";
          if (data.points_earned > 0) {
            $result.textContent = `✓ Passed all ${data.total} tests. +${data.points_earned} pts (total ${data.score})`;
          } else {
            $result.textContent = `✓ Passed all ${data.total} tests. (already solved — no points)`;
          }
          loadLeaderboard();
        } else {
          $result.className = "result fail show";
          $result.textContent = `✗ Passed ${data.passed}/${data.total} tests.`;
        }
      } catch (e) {
        $result.className = "result fail show";
        $result.textContent = "Could not reach the server.";
      }

      $submit.disabled = false;
      $submit.textContent = "Submit";
    };

    $reset.onclick = () => {
      $code.value = starterFor($language.value);
      $result.className = "result";
    };

    $code.addEventListener("keydown", (e) => {
      if (e.key === "Tab") {
        e.preventDefault();
        const start = $code.selectionStart;
        const end = $code.selectionEnd;
        $code.value = $code.value.slice(0, start) + "    " + $code.value.slice(end);
        $code.selectionStart = $code.selectionEnd = start + 4;
      }
    });

    (async () => {
      await loadNav();
      await load(1);
      await loadLeaderboard();
    })();
  </script>
</body>
</html>
